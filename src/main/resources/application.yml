spring:
  application:
    name: job-hunter-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${DB_NAME:jobhunter}
    username: ${DB_USERNAME:jobhunter}
    password: ${DB_PASSWORD:jobhunter}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    mcp:
      server:
        enabled: true
        protocol: STATELESS
        type: SYNC
        name: job-hunter
        version: ${BUILD_VERSION:dev}
        streamable-http:
          mcp-endpoint: /mcp

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:}

jobhunter:
  scraping:
    enabled-sources: ${SCRAPING_ENABLED_SOURCES:}
    schedule-interval: ${SCRAPING_SCHEDULE_INTERVAL:15m}
    lease-duration: ${SCRAPING_LEASE_DURATION:5m}
    lookback: ${SCRAPING_LOOKBACK:1h}
    retry-backoffs: ${SCRAPING_RETRY_BACKOFFS:1m,5m}
    max-attempts: ${SCRAPING_MAX_ATTEMPTS:3}
    max-batch-size: ${SCRAPING_MAX_BATCH_SIZE:250}
    max-batch-request-size: ${SCRAPING_MAX_BATCH_REQUEST_SIZE:8MB}
    retention-period: ${SCRAPING_RETENTION_PERIOD:30d}
    retention-interval: ${SCRAPING_RETENTION_INTERVAL:24h}
  materials:
    encryption-key: ${MATERIAL_ENCRYPTION_KEY:}
    max-artifact-bytes: ${MATERIAL_MAX_ARTIFACT_BYTES:5242880}
  automation:
    enabled: ${AUTOMATION_ENABLED:false}
    owner-issuer: ${AUTOMATION_OWNER_ISSUER:}
    owner-subject: ${AUTOMATION_OWNER_SUBJECT:}
    runner-issuer: ${AUTOMATION_RUNNER_ISSUER:}
    heartbeat-freshness: ${AUTOMATION_HEARTBEAT_FRESHNESS:2m}
    preflight-freshness: ${AUTOMATION_PREFLIGHT_FRESHNESS:10m}
    codex-freshness: ${AUTOMATION_CODEX_FRESHNESS:12h}
    max-clock-skew: ${AUTOMATION_MAX_CLOCK_SKEW:1m}
  ai:
    encryption-key: ${AI_ENCRYPTION_KEY:}
    matching:
      concurrency: ${AI_MATCHING_CONCURRENCY:10}
    providers:
      codex-base-url: ${AI_CODEX_BASE_URL:}
      groq-base-url: ${AI_GROQ_BASE_URL:https://api.groq.com/openai/}
      nvidia-base-url: ${AI_NVIDIA_BASE_URL:https://integrate.api.nvidia.com/}
      gemini-base-url: ${AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      retry-max-attempts: ${AI_PROVIDER_RETRY_MAX_ATTEMPTS:2}
      retry-backoff: ${AI_PROVIDER_RETRY_BACKOFF:1s}
      connect-timeout: ${AI_PROVIDER_CONNECT_TIMEOUT:5s}
      read-timeout: ${AI_PROVIDER_READ_TIMEOUT:60s}
  matching:
    interval-ms: ${MATCHING_INTERVAL_MS:60000}
    batch-size: ${MATCHING_BATCH_SIZE:200}
    max-attempts: ${MATCHING_MAX_ATTEMPTS:5}
    backoff-initial: ${MATCHING_BACKOFF_INITIAL:1m}
    backoff-max: ${MATCHING_BACKOFF_MAX:30m}
  retention:
    enabled: ${RETENTION_ENABLED:true}
    interval-ms: ${RETENTION_INTERVAL_MS:86400000}
    retention-period: ${RETENTION_PERIOD:30d}
    grace-period: ${RETENTION_GRACE_PERIOD:48h}
    batch-size: ${RETENTION_BATCH_SIZE:500}
    max-per-run: ${RETENTION_MAX_PER_RUN:5000}
  oidc:
    enabled: ${OIDC_ENABLED:true}
    issuers: ${OIDC_ISSUERS:}
    audience: ${OIDC_AUDIENCE:}
  proxy:
    enabled: ${PROXY_ENABLED:false}
    api-key: ${WEBSHARE_API_KEY:}
    base-url: ${WEBSHARE_BASE_URL:https://proxy.webshare.io/api/v2}
    cache-ttl-minutes: ${PROXY_CACHE_TTL_MINUTES:60}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:60}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    max-cache-size: ${RATE_LIMIT_MAX_CACHE_SIZE:10000}
  scrapeops:
    enabled: ${SCRAPEOPS_ENABLED:false}
    api-key: ${SCRAPEOPS_API_KEY:}
    num-results: ${SCRAPEOPS_NUM_RESULTS:50}
    refresh-interval-minutes: ${SCRAPEOPS_REFRESH_MINUTES:360}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.mshykhov.jobhunter: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui
